[package]
name = "git-porter"
version = "0.1.4"
edition = "2024"
publish = false
license = "MIT"

[[bin]]
name = "git-porter"
path = "src/bin/git-porter.rs"

[[bin]]
name = "git-send"
path = "src/bin/git-send.rs"

[[bin]]
name = "git-receive"
path = "src/bin/git-receive.rs"

[dependencies]
git2 = { version = "=0.21.0", default-features = false, features = ["vendored-libgit2", "unstable-sha256"] }
age = { version = "0.12.1", default-features = false }
bech32 = "0.12.0"
hkdf = "0.12.4"
libc = "0.2"
rand = "0.8.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
signature = "2.2.0"
signal-hook = "0.3.18"
ssh-key = { version = "0.6.7", default-features = false, features = ["alloc", "ed25519", "rand_core"] }
zeroize = "1.8.2"
tempfile = "3.23"
socket2 = "0.6.5"

[workspace]
resolver = "3"
